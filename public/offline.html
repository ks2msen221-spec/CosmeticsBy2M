<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vous êtes hors ligne — 2M Cosmetics Dakar</title>
    <meta name="theme-color" content="#1A1A1A" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #FAF9F6;
        color: #1A1A1A;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 4px;
        padding: 40px 28px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #C5A059;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #1A1A1A;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .badge {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: #C5A059;
        font-weight: 700;
        margin-bottom: 12px;
        display: block;
      }
      h1 {
        font-family: "Georgia", "Playfair Display", serif;
        font-style: italic;
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 14px;
        color: #1A1A1A;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #666666;
        margin-bottom: 28px;
        font-weight: 300;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 14px 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        border-radius: 2px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
      }
      .btn-primary {
        background-color: #1A1A1A;
        color: #FAF9F6;
      }
      .btn-primary:hover {
        background-color: #C5A059;
        color: #1A1A1A;
      }
      .btn-secondary {
        background-color: transparent;
        color: #1A1A1A;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .btn-secondary:hover {
        background-color: rgba(0, 0, 0, 0.04);
      }
      .footer-note {
        margin-top: 24px;
        font-size: 10px;
        color: #999999;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="/icon-192.png" alt="2M Cosmetics" />
      </div>
      <span class="badge">Mode Hors Ligne</span>
      <h1>Connexion Internet Interrompue</h1>
      <p>
        Cette page n'a pas encore été mise en cache sur votre appareil. 
        Veuillez vérifier votre connexion réseau (Wi-Fi ou données mobiles) 
        pour continuer à explorer notre boutique.
      </p>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="window.location.reload()">
          Réessayer la connexion
        </button>
        <button class="btn btn-secondary" onclick="window.history.back()">
          Page précédente
        </button>
      </div>
      <div class="footer-note">
        2M Cosmetics Dakar — Soins naturels &amp; transparents
      </div>
    </div>
  </body>
</html>
